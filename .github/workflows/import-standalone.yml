name: Import prepared standalone source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-standalone.yml]
permissions:
  contents: write
concurrency:
  group: import-prepared-standalone-source
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Download and verify prepared archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/JeonHaneul/Multi-layered-3D-NDT-Scan-Matching/releases/assets/731812154 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/standalone.zip"
          printf '%s  %s\n' '8876f563125442ba4099b50825e00cfeca2ed38267eea3da2ad54926f2b10d8a' "$RUNNER_TEMP/standalone.zip" | sha256sum --check -
      - name: Import exact source files
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import zipfile

          root = Path.cwd().resolve()
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "standalone.zip"
          prefix = "Multi-layered-3D-NDT-Scan-Matching/"
          records = []
          seen = set()
          with zipfile.ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  if entry.is_dir():
                      continue
                  if not entry.filename.startswith(prefix):
                      raise RuntimeError("Unexpected archive root")
                  relative = entry.filename[len(prefix):]
                  posix = PurePosixPath(relative)
                  if not relative or posix.is_absolute() or any(p in ("..", ".git") for p in posix.parts):
                      raise RuntimeError("Unsafe archive path")
                  if "\n" in relative or "\r" in relative or "\t" in relative or relative in seen:
                      raise RuntimeError("Duplicate or invalid archive path")
                  seen.add(relative)
                  mode = (entry.external_attr >> 16) & 0xffff
                  if stat.S_ISLNK(mode):
                      raise RuntimeError("Unexpected symbolic link")
                  target = root.joinpath(*posix.parts)
                  if not target.resolve().is_relative_to(root):
                      raise RuntimeError("Path outside destination")
                  data = archive.read(entry)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  executable = bool(mode & 0o111)
                  target.chmod(0o755 if executable else 0o644)
                  blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                  records.append((relative, "100755" if executable else "100644", blob))
          if len(records) != 3608:
              raise RuntimeError(f"Expected 3608 files, got {len(records)}")
          workflow_path = ".github/workflows/import-standalone.yml"
          workflow_data = (root / workflow_path).read_bytes()
          workflow_blob = hashlib.sha1(b"blob " + str(len(workflow_data)).encode() + b"\0" + workflow_data).hexdigest()
          records.append((workflow_path, "100644", workflow_blob))
          records.sort()
          subprocess.run(["git", "read-tree", "--empty"], check=True)
          file_input = "".join(path + "\n" for path, _, _ in records).encode()
          written = subprocess.run(["git", "hash-object", "-w", "--no-filters", "--stdin-paths"], input=file_input, stdout=subprocess.PIPE, check=True).stdout.decode().splitlines()
          if written != [blob for _, _, blob in records]:
              raise RuntimeError("Blob verification failed")
          index_input = b"".join((mode + " " + blob + "\t" + path).encode() + b"\0" for path, mode, blob in records)
          subprocess.run(["git", "update-index", "-z", "--index-info"], input=index_input, check=True)
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          if len([name for name in tracked if name]) != 3609:
              raise RuntimeError("Index file count mismatch")
          if any(name.endswith(b".gitmodules") for name in tracked):
              raise RuntimeError("Unexpected submodule manifest")
          print(f"Verified all 3608 archive files plus the temporary import workflow. Tree: {tree}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Imported and byte-verified all 3608 files from the prepared ZIP. The temporary import workflow will be removed after completion.\n\nTree: `{tree}`\n")
          PY
      - name: Commit and publish source
        run: |
          set -euo pipefail
          git config user.name 'Haneul Jeon'
          git config user.email '76903862+JeonHaneul@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git commit -m "Import prepared standalone NDT source and bundled dependencies"
          git push origin HEAD:main
          printf 'Published commit: %s\n' "$(git rev-parse HEAD)"
